name: Diameter checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m unittest tests.synthetic_check -v
      - run: python examples/create_demo.py
      - run: python main.py --folder output/demo-input --output output/demo-results --non-interactive
